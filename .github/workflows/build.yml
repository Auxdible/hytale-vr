name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check generated proxy files
        shell: bash
        run: |
          python tools/gen_proxy.py
          git diff --ignore-cr-at-eol --exit-code -- src/proxy/generated

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset release 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error (A|C|LNK)[0-9]+|: error" build.log | sort -u | head -40 | sed 's/^/::error::/' || true

      - name: Test
        run: ctest --preset release

      - name: Check opengl32.dll exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $out = & $dumpbin.FullName /exports build/Release/opengl32.dll
          $names = $out | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $expected = Get-Content tools/opengl32_exports.txt | Where-Object { $_ }
          $missing = $expected | Where-Object { $names -notcontains $_ }
          Write-Host "opengl32.dll exports $($names.Count) functions"
          if ($missing) { Write-Host "::error::Missing exports: $($missing -join ', ')"; exit 1 }
          $imports = & $dumpbin.FullName /dependents build/Release/opengl32.dll
          if ($imports -match 'opengl32\.dll') { Write-Host '::error::The proxy imports opengl32.dll'; exit 1 }

      - name: Package
        run: cmake --install build --config Release --prefix dist/HytaleVR

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HytaleVR-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/HytaleVR -DestinationPath HytaleVR-${{ github.ref_name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HytaleVR-${{ github.ref_name }}.zip
