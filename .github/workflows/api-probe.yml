name: API probe
on:
  push:
    branches: [api-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/checkout@v4
      - name: Download server jar
        run: |
          curl -fsSL https://maven.hytale.com/release/com/hypixel/hytale/Server/maven-metadata.xml | tee meta.xml
          V=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' meta.xml)
          [ -z "$V" ] && V=$(sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' meta.xml)
          echo "VERSION=$V"
          curl -fsSL -o server.jar "https://maven.hytale.com/release/com/hypixel/hytale/Server/$V/Server-$V.jar"
          ls -la server.jar
      - name: Dump API
        run: |
          cp server.jar /tmp/server.jar; jar tf server.jar | grep -E '\.class$' | sed 's/\.class$//; s:/:.:g' > classes.txt
          wc -l classes.txt
          cat > picked.txt <<'LIST'
com.hypixel.hytale.server.core.entity.AnimationUtils
com.hypixel.hytale.server.core.asset.type.item.config.ItemWeapon
com.hypixel.hytale.server.core.asset.type.item.config.ItemTool
com.hypixel.hytale.server.core.universe.world.storage.ChunkGrid
com.hypixel.hytale.math.shape.Box
com.hypixel.hytale.math.vector.Rotation3f
com.hypixel.hytale.function.predicate.BiIntPredicate
com.hypixel.hytale.server.core.modules.entity.damage.Damage$EntitySource
com.hypixel.hytale.server.core.modules.entity.damage.Damage$Source
com.hypixel.hytale.server.core.inventory.InventoryComponent$Hotbar
com.hypixel.hytale.protocol.BlockMaterial
com.hypixel.hytale.assetstore.map.BlockTypeAssetMap
com.hypixel.hytale.assetstore.map.IndexedLookupTableAssetMap
com.hypixel.hytale.assetstore.map.DefaultAssetMap
com.hypixel.hytale.assetstore.map.AssetMapWithIndexes
com.hypixel.hytale.assetstore.AssetMap
com.hypixel.hytale.server.core.entity.entities.Player
com.hypixel.hytale.server.core.entity.LivingEntity
com.hypixel.hytale.server.core.entity.Entity
com.hypixel.hytale.server.core.Message
com.hypixel.hytale.server.core.modules.entity.damage.DamageCause
com.hypixel.hytale.server.core.plugin.JavaPluginInit
com.hypixel.hytale.server.core.universe.world.World
com.hypixel.hytale.component.ComponentAccessor
com.hypixel.hytale.server.core.modules.entity.component.HeadRotation
com.hypixel.hytale.server.core.modules.entity.component.ModelComponent
com.hypixel.hytale.server.core.asset.type.model.config.Model
com.hypixel.hytale.server.core.modules.entity.teleport.Teleport
com.hypixel.hytale.protocol.AnimationSlot
LIST
          mkdir -p out
          while read c; do echo "===== $c"; javap -cp /tmp/server.jar -public "$c" 2>&1 | head -300; done < picked.txt > out/api2.txt
          while read c; do echo "===== $c"; javap -cp /tmp/server.jar -protected "$c" 2>&1 | grep -E "protected" ; done <<'LIST' >> out/api2.txt
com.hypixel.hytale.server.core.plugin.PluginBase
LIST
          wc -c out/*
          cp picked.txt out/
          wc -c out/*
      - name: Commit results
        run: |
          rm -f server.jar meta.xml
          mkdir -p probe && cp out/* probe/ && cp classes.txt probe/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add probe && git commit -m "API probe results" && git push
