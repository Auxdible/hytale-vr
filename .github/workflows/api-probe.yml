name: API probe
on:
  push:
    branches: [api-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/checkout@v4
      - name: Download server jar
        run: |
          curl -fsSL https://maven.hytale.com/release/com/hypixel/hytale/Server/maven-metadata.xml | tee meta.xml
          V=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' meta.xml)
          [ -z "$V" ] && V=$(sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' meta.xml)
          echo "VERSION=$V"
          curl -fsSL -o server.jar "https://maven.hytale.com/release/com/hypixel/hytale/Server/$V/Server-$V.jar"
          ls -la server.jar
      - name: Dump API
        shell: bash {0}
        run: |
          cp server.jar /tmp/server.jar; jar tf server.jar | grep -E '\.class$' | sed 's/\.class$//; s:/:.:g' > classes.txt
          wc -l classes.txt
          mkdir -p out
          while read c; do echo "===== $c"; javap -cp /tmp/server.jar -public "$c" 2>&1 | head -300; done < probe-list.txt > out/api2.txt
          echo "===== PluginBase protected" >> out/api2.txt
          javap -cp /tmp/server.jar -protected com.hypixel.hytale.server.core.plugin.PluginBase | grep protected >> out/api2.txt || true
          for c in com.hypixel.hytale.server.core.modules.interaction.interaction.config.client.BreakBlockInteraction com.hypixel.hytale.server.core.modules.interaction.interaction.config.server.DamageEntityInteraction; do
            echo "===== DISASM $c"; javap -cp /tmp/server.jar -c -p "$c" | grep -B40 -E "performBlockDamage|executeDamage|EntitySource.\"<init>\"" | head -400 || true
          done > out/disasm.txt
          javap -cp /tmp/server.jar -public com.hypixel.hytale.server.core.modules.interaction.interaction.config.server.combat.DamageCalculator >> out/api2.txt
          wc -c out/*
          cp picked.txt out/
          wc -c out/*
      - name: Commit results
        run: |
          rm -f server.jar meta.xml
          mkdir -p probe && cp out/* probe/ && cp classes.txt probe/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add probe && git commit -m "API probe results" && git push
