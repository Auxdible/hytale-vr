name: API probe
on:
  push:
    branches: [api-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/checkout@v4
      - name: Download server jar
        run: |
          curl -fsSL https://maven.hytale.com/release/com/hypixel/hytale/Server/maven-metadata.xml | tee meta.xml
          V=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' meta.xml)
          [ -z "$V" ] && V=$(sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' meta.xml)
          echo "VERSION=$V"
          curl -fsSL -o server.jar "https://maven.hytale.com/release/com/hypixel/hytale/Server/$V/Server-$V.jar"
          ls -la server.jar
      - name: Dump API
        run: |
          cp server.jar /tmp/server.jar; jar tf server.jar | grep -E '\.class$' | sed 's/\.class$//; s:/:.:g' > classes.txt
          wc -l classes.txt
          grep -E 'TargetUtil$|BlockHarvestUtils$|\.Teleport$|HeadRotation$|TransformComponent$|\.PlayerRef$|JavaPlugin$|PluginBase$|\.Damage$|DamageSystems$|DamageCause$|SectionReader$|\.Player$|EventRegistry$|PlayerReadyEvent$|PlayerDisconnectEvent$|PlayerConnectEvent$|\.World$|\.Universe$|InventoryComponent$|\.Inventory$|ItemStack$|ItemTool$|\.Item$|BlockType$|ModelComponent$|BoundingBox$|EntityStore$|ChunkStore$|\.Store$|\.Ref$|ComponentAccessor$|TaskRegistry$|DamageModule$|Transform$|Vector3d$|Vector3f$|Vector3i$|SetBlockSettings$|BlockSection$|PlayerRef$|HytaleLogger$|AddPlayerToWorldEvent$|SingleplayerModule$|InteractionModule$|InteractionManager$|InteractionType$|RootInteraction$|InteractionContext$|EntityStatMap$|DefaultEntityStatTypes$|SwingAnimation|PlayAnimation|AnimationSlot$|EntityAnimation|ClientCameraView$|SetServerCamera$|ServerCameraSettings$|Direction$|HeadRotation|BodyRotation|PlayerInput|MovementManager$' classes.txt | sort > picked.txt
          cat picked.txt
          mkdir -p out
          while read c; do echo "===== $c"; javap -cp /tmp/server.jar -public "$c" 2>&1 | head -400; done < picked.txt > out/api.txt
          grep -iE 'anim|swing' classes.txt | grep -iE 'packet|util|module|system' | head -80 > out/anim_classes.txt
          grep -iE 'damage' classes.txt | head -120 > out/damage_classes.txt
          grep -iE 'event' classes.txt | grep -iE 'player' | head -80 > out/player_events.txt
          cp picked.txt out/
          wc -c out/*
      - name: Commit results
        run: |
          rm -f server.jar meta.xml
          mkdir -p probe && cp out/* probe/ && cp classes.txt probe/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add probe && git commit -m "API probe results" && git push
